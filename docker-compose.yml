services:
  postgres:
    networks:
      - kase-core
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kase
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kase
    ports:
      - "5432:5432"
    # Named volume: without it `docker compose down` discards the database,
    # taking every applied migration with it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kase -d kase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    networks:
      - kase-core
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    networks:
      - kase-core
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the evidence bucket S3Service writes to. Without this
  # the first uploadEvidence() call fails with NoSuchBucket.
  minio-init:
    networks:
      - kase-core
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kase-evidence &&
      echo 'bucket kase-evidence ready'
      "
    restart: "no"

  fixture:
    image: kase/fixture:dev
    build:
      context: .
      dockerfile: fixtures/vulnerable-app/Dockerfile
    environment:
      # main.ts binds PORT when run as an entrypoint; the spike imports
      # bootFixture() directly and picks an ephemeral port instead.
      PORT: 3000
      FIXTURE_COMMIT_SHA: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
    ports:
      - "3001:3000"
    networks:
      - target-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  egress-proxy:
    image: ubuntu/squid:6.6-24.04_beta
    volumes:
      - ./infra/egress/squid.conf:/etc/squid/squid.conf:ro
    networks:
      - recon-egress
      - target-net
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:size=16m,mode=0775,uid=13,gid=13
      - /var/spool/squid:size=32m,mode=0755,uid=13,gid=13
      - /var/log/squid:size=16m,mode=0755,uid=13,gid=13
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/squid.pid && kill -0 \"$(cat /run/squid.pid)\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: workers/Dockerfile
      target: worker-base
    environment:
      DATABASE_URL: postgresql://kase:password@postgres:5432/kase?schema=public
    command: ["packages/db/node_modules/.bin/prisma", "migrate", "deploy", "--schema", "packages/db/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kase-core
    restart: "no"

  api:
    build:
      context: .
      dockerfile: workers/Dockerfile
      target: api
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://kase:password@postgres:5432/kase?schema=public
      KASE_REDIS_HOST: redis
      KASE_REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kase-evidence
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      KASE_LOCAL_KEK: ${KASE_LOCAL_KEK:?Set KASE_LOCAL_KEK to a 32-byte base64 key}
    ports:
      - "3002:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - kase-core
      - api-host

  worker-recon:
    build:
      context: .
      dockerfile: workers/Dockerfile
      target: worker-recon
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/seccomp/worker.json
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/kase-secrets:size=4m,mode=0700,uid=10001,gid=10001
    environment:
      DATABASE_URL: postgresql://kase:password@postgres:5432/kase?schema=public
      KASE_REDIS_HOST: redis
      KASE_REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: kase-evidence
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      KASE_LOCAL_KEK: ${KASE_LOCAL_KEK:?Set KASE_LOCAL_KEK to a 32-byte base64 key}
      KASE_EGRESS_PROXY: http://egress-proxy:3128
      KASE_WORKER_IMAGE_DIGEST: kase/worker-recon:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      egress-proxy:
        condition: service_healthy
      fixture:
        condition: service_healthy
    networks:
      - kase-core
      - recon-egress
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  worker-agent-check:
    build:
      context: .
      dockerfile: workers/Dockerfile
      target: worker-agent
    profiles: ["security-check"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/seccomp/worker.json
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /run/kase-secrets:size=4m,mode=0700,uid=10001,gid=10001
    command:
      - sh
      - -c
      - >-
        test "$(id -u)" = 10001 &&
        ! curl --max-time 3 http://fixture:3000/healthz &&
        ! curl --max-time 3 --proxy http://egress-proxy:3128 http://fixture:3000/healthz
    networks:
      - kase-core

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  kase-core:
    internal: true
  api-host:
  recon-egress:
    internal: true
  target-net:
    internal: true
