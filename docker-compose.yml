services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kase
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kase
    ports:
      - "5432:5432"
    # Named volume: without it `docker compose down` discards the database,
    # taking every applied migration with it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kase -d kase"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the evidence bucket S3Service writes to. Without this
  # the first uploadEvidence() call fails with NoSuchBucket.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kase-evidence &&
      echo 'bucket kase-evidence ready'
      "
    restart: "no"

  fixture:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./fixtures/vulnerable-app:/app
    environment:
      # main.ts binds PORT when run as an entrypoint; the spike imports
      # bootFixture() directly and picks an ephemeral port instead.
      PORT: 3000
      FIXTURE_COMMIT_SHA: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
    command: sh -c "npm install --no-audit --no-fund && npx tsx main.ts"
    ports:
      - "3001:3000"

volumes:
  postgres-data:
  redis-data:
  minio-data:
