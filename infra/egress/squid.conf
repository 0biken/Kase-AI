http_port 3128

# Deployment-generated coarse host boundary. The M3 worker applies the
# authoritative per-audit host, port, and path policy before each probe.
acl fixture_host dstdomain "/etc/squid/allowed-hosts.txt"
acl fixture_port port 3000
acl safe_methods method GET HEAD

http_access allow safe_methods fixture_host fixture_port
http_access deny all

access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
buffered_logs off
cache deny all
via off
forwarded_for delete
request_header_access Authorization deny all
request_header_access Proxy-Authorization deny all
