http_port 3128

# M1 fixture-only allowlist. Dynamic project policy is introduced in M3.
acl fixture_host dstdomain fixture
acl fixture_port port 3000
acl safe_methods method GET HEAD

http_access allow safe_methods fixture_host fixture_port
http_access deny all

access_log stdio:/dev/stdout
cache_log /dev/stderr
cache deny all
via off
forwarded_for delete
request_header_access Authorization deny all
request_header_access Proxy-Authorization deny all
