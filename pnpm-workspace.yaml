packages:
  - 'apps/*'
  - 'packages/*'
  # The vulnerable fixture is a real workspace package: the correlation spike
  # imports it directly, and docker-compose runs it as a service. Without this
  # its dependencies never get linked and the spike cannot boot it.
  - 'fixtures/*'

# Packages whose install scripts are required. Prisma cannot generate a client
# without its postinstall; unrs-resolver ships a native binding used by eslint.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - unrs-resolver
